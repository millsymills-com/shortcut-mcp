[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shortcut-mcp"
version = "0.2.0"
description = "Python FastMCP server for the Shortcut REST API (read surface)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "millsmillsymills" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.2.4,<4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.0",
    "hypothesis>=6.150.0",
    "ruff>=0.15.0",
    "ty>=0.0.34",
    "pre-commit>=4.6.0",
]

[project.scripts]
shortcut-mcp = "shortcut_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shortcut_mcp"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF", "PT", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"src/shortcut_mcp/tools/**/*.py" = ["TC001", "TC002"]  # FastMCP needs runtime annotations
"tests/**/*.py" = ["ARG001"]                            # unused fixture args are fine

[tool.ruff.lint.isort]
known-first-party = ["shortcut_mcp"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "mocked: respx-mocked unit tests",
    "live: requires SHORTCUT_API_TOKEN",
    "smoke: minimal live read",
    "slow: slow tests",
    "live_write: opt-in live write/destructive tests against an isolated workspace",
]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["src/shortcut_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests"]
