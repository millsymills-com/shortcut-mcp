repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty has no published pre-commit repo yet; run the project's pinned copy.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: claude-settings-guard
        name: Check staged Claude settings
        entry: python3 .github/security/check_claude_settings.py --staged
        language: system
        pass_filenames: false
        always_run: true
