name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --extra dev --frozen
      - run: uv run ty check

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -m "not live and not live_write" --cov=shortcut_mcp --cov-fail-under=90

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --extra dev --frozen
      - name: README tool catalog drift check
        run: uv run python scripts/generate_tool_catalog.py --check

  security-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --frozen
      - name: Workflow audit (zizmor)
        # Offline: skips audits that need a GitHub token / network, keeping the
        # audit hermetic. Current workflows pass with no findings.
        run: uvx zizmor@1.24.1 --offline .github/workflows/
      - name: Static analysis (bandit)
        run: uvx bandit -c pyproject.toml -r src
      - name: Dependency audit (pip-audit)
        # Audit the resolved environment rather than a requirements file: pip-audit's
        # -r mode builds an isolated venv whose ensurepip is broken on uv's standalone
        # Python. Environment mode enumerates installed packages instead.
        run: |
          uv pip install pip-audit pip
          uv run pip-audit

  # Stable names required by the branch ruleset; fail if any matrix leg fails,
  # is cancelled, or is skipped. Keep these jobs free of dependency installs.
  test:
    if: always()
    needs: [test-python]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python test jobs to pass
        env:
          RESULT: ${{ needs.test-python.result }}
        run: test "$RESULT" = success

  security:
    if: always()
    needs: [security-python]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python security jobs to pass
        env:
          RESULT: ${{ needs.security-python.result }}
        run: test "$RESULT" = success
