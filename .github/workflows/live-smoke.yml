name: Live smoke

# Split live-API harness, kept off PR/push CI so it never blocks normal merges:
#   - read-smoke runs nightly (and on manual dispatch) against the real workspace
#   - write-tests runs only on manual dispatch with run_write_tests=true, against
#     an ISOLATED workspace token — never the nightly read token
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      run_write_tests:
        description: "Also run live write/destructive tests (isolated workspace)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Live read smoke
        run: uv run pytest -m "live and not live_write" -ra
        env:
          SHORTCUT_API_TOKEN: ${{ secrets.SHORTCUT_API_TOKEN }}

  write-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_write_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Live write/destructive tests
        run: uv run pytest -m live_write -ra
        env:
          SHORTCUT_LIVE_WRITE_TESTS: "true"
          SHORTCUT_TEST_WORKSPACE_TOKEN: ${{ secrets.SHORTCUT_TEST_WORKSPACE_TOKEN }}
