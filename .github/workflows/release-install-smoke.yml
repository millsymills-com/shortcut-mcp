name: Release install smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build wheel
        run: uv build
      - name: Install built wheel into a clean 3.13 environment
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - name: Verify import, version, and console script
        run: |
          /tmp/smoke/bin/python -c "import shortcut_mcp; assert shortcut_mcp.__version__ != '0.0.0+unknown', shortcut_mcp.__version__; print(shortcut_mcp.__version__)"
          test -x /tmp/smoke/bin/shortcut-mcp
