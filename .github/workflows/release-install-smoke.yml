name: Release install smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Build wheel
        run: uv build
      - name: Install built wheel into a clean 3.13 environment
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - name: Verify import, version, and console script
        run: |
          /tmp/smoke/bin/python -c "import shortcut_mcp; assert shortcut_mcp.__version__ != '0.0.0+unknown', shortcut_mcp.__version__; print(shortcut_mcp.__version__)"
          test -x /tmp/smoke/bin/shortcut-mcp
